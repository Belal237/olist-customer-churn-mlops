name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-cache-dir -r requirements.txt

        - name: "CI setup: create data dirs"
        run: |
          bash scripts/ci_setup.sh

      - name: Lint with flake8 (optional)
        run: |
          python -m pip install --no-cache-dir flake8
          flake8 src/ tests/ --count --select=E9,F63,F7,F82 --show-source --statistics
        continue-on-error: true

      - name: Run unit tests
        run: |
          python -m pytest -v tests/unit/test_build.py tests/unit/test_api.py

      - name: Generate coverage report
        run: |
          python -m pytest -v --cov=src/features --cov=src/api --cov-report=term-missing --cov-report=xml

      - name: Upload coverage to Codecov (optional)
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage.xml
          fail_ci_if_error: false

      - name: Build Docker image
        run: |
          docker build --file Dockerfile --tag olist-churn-api:latest .
